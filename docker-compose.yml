services:
  db:
    image: postgres:18-alpine
    container_name: crm_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-crm_db}
      POSTGRES_USER: ${DB_USER:-crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crmpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-crm} -d ${DB_NAME:-crm_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-crm}
      - DB_PASSWORD=${DB_PASSWORD:-crmpass}
      - DB_NAME=${DB_NAME:-crm_db}
      - DB_SSLMODE=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
